# @package eval.rwku
# NOTE: the above line is not a comment, but sets the package for config. See https://hydra.cc/docs/upgrades/0.11_to_1.0/adding_a_package_directive/

defaults:
  - rwku_metrics:
    - forget_level1_rouge
    - forget_level2_rouge
    - forget_level3_rouge
    - neighbor_level1_rouge
    - neighbor_level2_rouge

handler: RWKUEvaluator
output_dir: ${paths.output_dir}
metrics: {}
overwrite: false
target: "Batch/1-10"  # Can be single target like "Target/1_Stephen_King" or batch like "Batch/1-10"