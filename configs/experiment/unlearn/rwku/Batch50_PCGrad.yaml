# @package _global_

defaults:
  - override /model: Llama-3-8B-Instruct
  - override /trainer: GradDiffWithSurgery
  - override /data: unlearn
  - override /data/datasets@data.forget: RWKU_forget_llama3
  - override /data/datasets@data.retain: RWKU_retain_llama3
  - override /eval: rwku


target: "Batch/1-50"


# Dynamic data configuration based on target type
data:
  anchor: forget
  forget:
    RWKU_forget_llama3:
      args:
        hf_args:
          data_files: "data/rwku/${target}/passage.json"
  retain:
    RWKU_retain_llama3:
      args:
        hf_args:
          data_files: "data/rwku/${target}/retain_passage.json"

eval:
  rwku:
    target: ${target}

trainer:
  args:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 32
    learning_rate: 3e-6
    num_train_epochs: 2
    warmup_ratio: 0.1

  method_args:
    alpha: 1.0
    gamma: 1.0
    surgery_strategy: "pcgrad"

